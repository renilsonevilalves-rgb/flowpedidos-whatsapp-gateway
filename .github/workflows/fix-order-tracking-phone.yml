name: Fix WhatsApp order tracking phone

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch tracking phone resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text()
          old = 'const customerJid = msg.key.remoteJidAlt || remoteJid;\n          const customerPhone = customerJid.split("@")[0].split(":")[0];'
          new = '''const customerJid = [\n            msg.key.remoteJidAlt,\n            msg.key.senderPn,\n            msg.key.participantPn,\n            remoteJid,\n          ].find((value: unknown) => typeof value === "string" && /@s\\.whatsapp\\.net$/.test(value)) ||\n            msg.key.remoteJidAlt ||\n            msg.key.senderPn ||\n            msg.key.participantPn ||\n            remoteJid;\n          const customerPhone = customerJid.split("@")[0].split(":")[0];'''
          if old not in s:
            raise SystemExit('Expected tracking phone block was not found; refusing unsafe edit.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix WhatsApp tracking phone resolution'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-order-tracking-phone.yml || true
          git diff --cached --quiet || git commit -m 'chore: remove temporary fix workflow'
          git push || true
