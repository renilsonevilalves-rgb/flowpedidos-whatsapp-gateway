name: Fix WhatsApp LID order tracking

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[lid-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tracking phone resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text()
          old = 'const customerPhone = remoteJid.split("@")[0].split(":")[0];'
          new = 'const customerJid = msg.key.remoteJidAlt || remoteJid;\n          const customerPhone = customerJid.split("@")[0].split(":")[0];'
          if old not in s:
              raise SystemExit('Expected order-tracking phone extraction was not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts
          git commit -m "fix: resolve WhatsApp LID phone for order tracking [lid-fix]"
          git push
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-lid-order-tracking.yml
          git commit -m "chore: remove one-time LID repair workflow [lid-fix]"
          git push
