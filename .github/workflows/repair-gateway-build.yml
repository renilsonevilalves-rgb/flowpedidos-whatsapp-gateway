name: Repair gateway build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[gateway-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          source_path = Path('src/server.ts')
          source = source_path.read_text()

          old_send = '''    await session.sock.sendMessage(`${phone}@s.whatsapp.net`, { text });
    logger.info({ sessionId, phone }, "[Outbound] Mensagem enviada com sucesso");
    res.json({ ok: true, phone });'''
          new_send = '''    const recipients = await session.sock.onWhatsApp(phone);
    const recipient = recipients.find((item: any) => item?.exists && item?.jid);

    if (!recipient?.jid) {
      logger.warn({ sessionId, phone }, "[Outbound] Número não encontrado no WhatsApp");
      res.status(404).json({ ok: false, error: "O número informado não possui uma conta WhatsApp válida." });
      return;
    }

    const sentMessage = await session.sock.sendMessage(recipient.jid, { text });
    logger.info({ sessionId, phone, recipientJid: recipient.jid, messageId: sentMessage?.key?.id || null }, "[Outbound] Mensagem aceita pelo WhatsApp");
    res.json({ ok: true, phone, recipientJid: recipient.jid, messageId: sentMessage?.key?.id || null });'''
          if old_send in source:
              source = source.replace(old_send, new_send, 1)

          source = source.replace(
              '        } catch (error) {\n          logger.error({ error: error?.message || error, sessionId: id, remoteJid }, "[Order-Tracking] Falha ao consultar/enviar status");',
              '        } catch (error: any) {\n          logger.error({ error: error?.message || error, sessionId: id, remoteJid }, "[Order-Tracking] Falha ao consultar/enviar status");',
              1,
          )

          source_path.write_text(source)

          package_path = Path('package.json')
          package_data = json.loads(package_path.read_text())
          package_data['scripts'].pop('prebuild', None)
          package_path.write_text(json.dumps(package_data, indent=2, ensure_ascii=False) + '\n')

          patch_path = Path('scripts/patch-whatsapp-send.cjs')
          if patch_path.exists():
              patch_path.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts package.json scripts/patch-whatsapp-send.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Repair gateway build [gateway-repair]"
          git push
